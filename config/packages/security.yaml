security:
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
  # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
  providers:
    users:
      entity:
        class: App\Entity\User
        property: username
    teachers:
      entity:
        class: App\Entity\Teacher
        property: email
    app_user_provider:
      chain:
        providers: [ 'users', 'teachers' ]
    #  firewalls:
    #    dev:
    #      pattern: ^/(_(profiler|wdt)|css|images|js)/
    #      security: false
    #
    ##    options:
    ##      pattern: ^/
    ##      methods: [ OPTIONS ]
    ##      security: false
    #
    #    google:
    #      pattern: ^/api/auth/google
    #      stateless: true
    #      security: false
    #
    #    login:
    #      pattern: ^/api/login
    #      stateless: true
    #      provider: users
    #      json_login:
    #        check_path: /api/login
    #        success_handler: lexik_jwt_authentication.handler.authentication_success
    #        failure_handler: lexik_jwt_authentication.handler.authentication_failure
    #
    #
    #    api:
    #      pattern: ^/api
    #      stateless: true
    #      provider: teachers
    #      jwt: ~
    #        ===============================
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # Обработка Google OAuth - без аутентификации
    google_oauth:
      pattern: ^/api/auth/google
      stateless: true
      security: false

    # API логин для User (обычный JSON логин)
    api_login:
      pattern: ^/api/login
      stateless: true
      provider: users
      json_login:
        check_path: /api/login
        success_handler: lexik_jwt_authentication.handler.authentication_success
        failure_handler: lexik_jwt_authentication.handler.authentication_failure

    # API endpoints - для Teacher с JWT
    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider  # Для API используем Teacher провайдер
      jwt: ~
      # Исключаем из JWT защищенные пути
      entry_point: jwt
      # Разрешаем анонимный доступ к некоторым API маршрутам

    # Web интерфейс - для User с формой логина
    main:
      lazy: true
      provider: users
      form_login:
        login_path: app_login
        check_path: app_login
        default_target_path: /choose-role
        enable_csrf: false  # ← ОТКЛЮЧИТЬ CSRF
      logout:
        path: app_logout
        target: app_login

  access_control:
    - { path: ^/api/years$, roles: PUBLIC_ACCESS }
    - { path: ^/api/admin, roles: ROLE_ADMIN }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/director, roles: ROLE_DIRECTOR }
  #    - { path: ^/api/user, roles: ROLE_USER }

  role_hierarchy:
    ROLE_ADMIN: ROLE_USER
    ROLE_DIRECTOR: ROLE_USER
    ROLE_EXPERT: ROLE_USER


when@test:
  security:
    password_hashers:
      # By default, password hashers are resource intensive and take time. This is
      # important to generate secure password hashes. In tests however, secure hashes
      # are not important, waste resources and increase test times. The following
      # reduces the work factor to the lowest possible values.
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4 # Lowest possible value for bcrypt
        time_cost: 3 # Lowest possible value for argon
        memory_cost: 10 # Lowest possible value for argon
