services:
  php:
    build:
      context: ../
      dockerfile: docker/php/Dockerfile.prod
    container_name: ${PHP_CONTAINER_NAME}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../:/app:cached
    environment:
      PHP_IDE_CONFIG: "serverName=docker-server"

  nginx:
    build:
      context: nginx
    container_name: ${NGINX_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - ../:/app:cached
      - "./nginx/conf.d.prod:/etc/nginx/conf.d:ro"
    # Порт на хост не публикуем: перед стеком стоит общий reverse-proxy,
    # который держит 80/443 и маршрутизирует трафик по hostname (api.pps.makalabox.com).
    expose:
      - 80

  db:
    build: ./db
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      # Слушаем только 127.0.0.1: снаружи база не должна быть доступна.
      # Для прямого доступа с машины разработчика: ssh -L ${DB_EXTERNAL_PORT}:127.0.0.1:${DB_EXTERNAL_PORT}
      - "127.0.0.1:${DB_EXTERNAL_PORT}:5432"
    volumes:
      - "${DB_EXTERNAL_DATA}:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
