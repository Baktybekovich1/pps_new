services:
  php:
    build:
      context: ../
      dockerfile: docker/php/Dockerfile.prod
    container_name: ${PHP_CONTAINER_NAME}
    env_file: .env
    volumes:
      - ../:/app:cached
    environment:
      PHP_IDE_CONFIG: "serverName=docker-server"
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbit:5672/%2f/messages   # ← одна строка
    depends_on: #
      - rabbit #

  nginx:
    build:
      context: nginx
    container_name: ${NGINX_CONTAINER_NAME}
    depends_on:
      - php
    volumes:
      #      - /etc/letsencrypt/live/api.pps.makalabox.com/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      #      - /etc/letsencrypt/live/api.pps.makalabox.com/privkey.pem:/etc/ssl/private/privkey.pem:ro
      #      - /etc/letsencrypt:/etc/letsencrypt:ro
      #      - ../:/app:cached
      #      - "./nginx/conf.d.prod:/etc/nginx/conf.d"
      ##      - ./certbot/www:/etc/letsencrypt
      #      - ./certbot/www:/etc/letsencrypt/live/api.pps.makalabox.com

      - ../:/app:cached
      #      - "./nginx/conf.d:/etc/nginx/conf.d"  # Используйте обычный конфиг, не .prod
      - "./nginx/conf.d.prod:/etc/nginx/conf.d"
      - "/etc/letsencrypt:/etc/letsencrypt:ro"  # Правильный путь к certbot
    ports:
      - "${NGINX_EXTERNAL_PORT}:80"
      - "443:443"
  #    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  #  certbot:
  #    image: certbot/certbot
  #    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 24h & wait $${!}; done;'"
  #    volumes:
  #      - ./certbot/conf:/etc/letsencrypt
  #      - ./certbot/www:/var/www/certbot

  db:
    build: ./db
    container_name: ${DB_CONTAINER_NAME}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - "${DB_EXTERNAL_DATA}:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
  #////////////
  rabbit:
    image: rabbitmq:3.12-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-rabbit
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # UI  guest/guest
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../
      dockerfile: docker/php/Dockerfile.prod   # тот же образ, что и php-fpm
    container_name: ${COMPOSE_PROJECT_NAME}-worker
    command: >
      bash -c "sleep 10 &&
               cd /app &&
               php bin/console messenger:consume async --limit=500 -vv"
    volumes:
      - ../:/app:cached
    environment:
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbit:5672/%2f/messages
    depends_on:
      rabbit:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbit_data:
